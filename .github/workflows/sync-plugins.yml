name: sync-marketplace-from-sources
on:
  schedule:
    - cron: "17 6 * * *"   # daily, always track latest
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: [".claude-plugin/marketplace.json", "scripts/sync_marketplace.py"]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sync marketplace metadata from each plugin source
        run: python scripts/sync_marketplace.py
      - name: Commit if changed
        run: |
          if ! git diff --quiet -- .claude-plugin/marketplace.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .claude-plugin/marketplace.json
            git commit -m "chore: auto-sync marketplace metadata from plugin sources"
            git push
          else
            echo "already in sync"
          fi
